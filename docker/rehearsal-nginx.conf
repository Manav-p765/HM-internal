# REHEARSAL ONLY. Mimics a TLS-terminating reverse proxy in front of the app: the browser talks plain http
# to localhost, and the app is told the original request was https (X-Forwarded-Proto), so it behaves exactly
# as behind a real proxy: secure session cookie, real client IP from X-Forwarded-For (TRUST_PROXY=1).
# A real deployment uses TLS here (see docs/DEPLOY.md) and must also forward these headers.
server {
  listen 80;
  client_max_body_size 2m;
  location / {
    proxy_pass http://app:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
