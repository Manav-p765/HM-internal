# Production-mode stack for a LOCAL REHEARSAL (and a starting point for a single-VPS deploy).
#
#   cp .env.production.example .env.production      # fill in; never commit it
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml run --rm app migrate          # release step, explicit
#   docker compose -f docker-compose.prod.yml run --rm -it app create-admin --email you@example.com
#   docker compose -f docker-compose.prod.yml up -d app
#
# Rehearsal only (profile "rehearsal", never in a real deployment):
#   docker compose -f docker-compose.prod.yml --profile rehearsal up -d
#   - mailpit: catches every email (UI http://localhost:8025); point SMTP_HOST at "mailpit", port 1025.
#   - proxy:   nginx on http://localhost:8088 that forwards to the app with X-Forwarded-Proto: https,
#              standing in for the TLS-terminating reverse proxy of a real host. Use APP_URL=http://localhost:8088.
#
# Host ports are bound to 127.0.0.1 only. Postgres is not published at all (backups use "exec db pg_dump").

name: hm-internal-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env.production   # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - hm_prod_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: hm-internal:local
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8090}:4000"
    # SIGTERM, then up to 15 s to drain in-flight requests (the server itself gives up after 10 s).
    stop_grace_period: 15s

  # ---- REHEARSAL ONLY: dev mail catcher. Never part of a real deployment. ----
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["rehearsal"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

  # ---- REHEARSAL ONLY: stands in for the TLS reverse proxy (sends X-Forwarded-Proto: https). ----
  proxy:
    image: nginx:1.27-alpine
    profiles: ["rehearsal"]
    depends_on: [app]
    volumes:
      - ./docker/rehearsal-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PROXY_HOST_PORT:-8088}:80"

volumes:
  hm_prod_pgdata:
